name: nen
services:
  db:
    image: postgres:15
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      POSTGRES_DB: nen
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - nen_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nen"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/nen
      PORT: 3001
      INIT_DB_RESET: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      TELEGRAM_DEFAULT_THREAD_ID: ${TELEGRAM_DEFAULT_THREAD_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3001
        VITE_POLL_INTERVAL_MS: 30000
        VITE_MODBUS_SITE_IDS: "1,2"
        VITE_MODBUS_PORT: 502
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    ports:
      - "3002:3002"
    environment:
      API_TARGET: http://server:3001
      PORT: 3002
    depends_on:
      server:
        condition: service_healthy

  agent:
    build: ./agent
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 192m
    environment:
      SERVER_URL: http://server:3001
      POLL_INTERVAL_MS: 60000
      POLL_INITIAL_DELAY_MS: 30000
      REQUEST_TIMEOUT_MS: 15000
      MODBUS_SITE_IDS: "1,2"
      MODBUS_PORT: 502
      MODBUS_UNIT_ID: 1
    depends_on:
      server:
        condition: service_healthy

volumes:
  nen_pgdata_local:
